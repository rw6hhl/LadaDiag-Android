# gradle.properties — параметры сборки Android-проекта.
# Версия: V1.0 (15.10.2026)

# Включение AndroidX (обязательно для современных библиотек).
android.useAndroidX=true

# Отключение Jetifier (не нужен, если нет старых support-библиотек).
android.enableJetifier=false

# Параметры JVM для Gradle (ускоряет сборку, избегает OutOfMemory).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей.
org.gradle.parallel=true